[package]
name = "runaway_zeppelin_2"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
bevy-inspector-egui = "0.37.0"
bevy_common_assets = { version = "0.17.0", features = ["ron"] }
chrono = "0.4.45"
bevy_enhanced_input = "0.26"
serde = "1.0.229"
yarnspinner = "0.9.0"
rand = "0.10.2"
bevy_rand = { version = "0.15.2", features = ["chacha20"] }
priority-queue = "2.7.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
